<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Racing Drone">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21c7b0"/>
      <stop offset="1" stop-color="#6fe3d0"/>
    </linearGradient>
  </defs>
  <!-- Three gates in perspective, receding toward the upper right. -->
  <g fill="none" stroke="url(#g)" stroke-linejoin="round">
    <rect x="44" y="140" width="112" height="112" rx="10" stroke-width="12"/>
    <rect x="164" y="98" width="70" height="70" rx="7" stroke-width="8" opacity="0.8"/>
    <rect x="240" y="64" width="40" height="40" rx="5" stroke-width="5" opacity="0.6"/>
  </g>
  <!-- The racing line through their centers. -->
  <path d="M28 300 C 70 250, 90 210, 100 196 S 170 150, 199 133 S 250 92, 260 84 L 296 40" fill="none" stroke="#21c7b0" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12"/>
  <circle cx="100" cy="196" r="9" fill="#21c7b0"/>
</svg>
