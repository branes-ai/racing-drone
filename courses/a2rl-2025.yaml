# Approximation of the A2RL 2025 course: 11 gates with 1.5 m inner openings,
# two laps, in the published 76 × 18 × 5.4 m flight volume (MonoRace paper).
# The real gate layout is not public; this oval is a stand-in for framework
# tests and early SITL work, not a reproduction of the competition track.
#
# Course frame: x along the hall, y across it, z up; origin at a floor corner.
# A gate's x axis is its normal, pointing in the direction of travel.
name: a2rl-2025-approx
laps: 2
geofence:
  min_m: [0.0, 0.0, 0.0]
  max_m: [76.0, 18.0, 5.4]
