# SITL determinism gate (docs/plan/sitl/): RP-1 hops off the pad under the
# scripted-hop baseline, with IMU noise and bias, randomized parameters, and
# a camera-corruption fault, so every random stream is in use.
name: scripted-hop
course: ../courses/a2rl-2025.yaml
vehicle: ../vehicles/rp1.yaml
duration_s: 1.5
seed: 20261026
randomization:
  mass: 0.05
  inertia: 0.1
  drag: 0.1
  motor_time_constant: 0.1
  start_xy_m: 0.2
  start_yaw_rad: 0.1
faults:
  - {type: camera_corrupt, t_s: 0.0, probability: 0.25}
  - {type: imu_bias_step, t_s: 0.8, gyro: [0.01, 0.0, 0.0], accel: [0.0, 0.0, 0.1]}
